# Nginx внутри контейнера сайта: раздача статики Vite (SPA)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: все пути отдаём на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хэшированные ассеты Vite — агрессивное кэширование
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Статика из public (фото портфолио, логотип)
    location ~* \.(jpg|jpeg|png|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
